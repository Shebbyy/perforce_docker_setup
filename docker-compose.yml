services:
  perforce:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: perforce

    restart: unless-stopped

    ports:
      - "1666:1666"

    environment:
      P4PORT: "1666"
      P4ROOT: "/perforce/serverdata"
      P4JOURNAL: "/perforce/serverjournals/journal"
      P4LOG: "/perforce/serverdata/log"

    volumes:
      - INSERT_PATH_OF_YOUR_CHOICE/serverdata:/perforce/serverdata
      - INSERT_PATH_OF_YOUR_CHOICE/serverjournals:/perforce/serverjournals
      - INSERT_PATH_OF_YOUR_CHOICE/servercheckpoints:/perforce/servercheckpoints
      - INSERT_PATH_OF_YOUR_CHOICE/serverlibrary:/perforce/serverlibrary

    stop_grace_period: 60s

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "p4 -p localhost:1666 info >/dev/null 2>&1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

